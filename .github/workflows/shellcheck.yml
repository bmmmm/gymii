name: shellcheck

on:
  push:
    branches: [main]
    paths: ['scripts/**']
  pull_request:
    branches: [main]
    paths: ['scripts/**']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  shellcheck:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # 2.0.0
        with:
          scandir: './scripts'
          severity: warning
        env:
          SHELLCHECK_OPTS: --shell=bash --exclude=SC1090,SC1091,SC2034,SC1007
