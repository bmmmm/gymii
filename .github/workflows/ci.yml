name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      # every test/*.test.mjs runs — a new module's tests must not need a
      # workflow edit to be taken seriously. Node's own runner, no
      # dependency: each file is still a plain script in its own process
      # (the localStorage stub stays per file), every file runs even after
      # one fails, and the summary names them all. The glob is quoted so
      # node expands it — test/helpers/ never matches.
      - run: node --test --test-reporter=spec 'test/*.test.mjs'

  # No build step means nothing parses the shipped scripts before a browser
  # does: a stray typo in app/js/app.js or app/sw.js sails through the logic tests
  # (they import single modules) and only breaks the live page. This parses
  # every one of them.
  # NOT `node --check <file>`: for a plain .js file that parses as CommonJS,
  # node detects the ESM syntax, switches, and then exits 0 without ever
  # reporting the module parse error — verified red-vs-green on node 24.20
  # and 26.7, where a deliberately broken js/app.js passed. Feeding the file
  # in with --input-type=module forces a real module parse, which is also why
  # the file name is echoed by hand: the error then points at "[stdin]".
  static-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the version gate below diffs against the pushed range
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
      - name: Every shipped script parses
        run: |
          for f in app/js/*.js app/sw.js; do
            echo "== $f"
            node --input-type=module --check < "$f" || exit 1
          done

      # The app stays dependency-free even though the tests are not. Nothing
      # that ships may reference node_modules — a bundler-shaped import would
      # 404 in the browser and be invisible to every other job.
      - name: Nothing shipped reaches into node_modules
        run: |
          if git grep -n 'node_modules' -- app; then
            echo "::error::a shipped file references node_modules"
            exit 1
          fi
          echo "No shipped file references node_modules."

      # "Which build am I running?" has exactly one answer, app/js/version.js, and
      # only while it is bumped — a PWA updates itself in the background, so a
      # stale number is worse than none. A push to main that ships changed
      # files and leaves it alone stops here, before Pages sees it. Pull
      # requests are exempt: the bump belongs on the deploy, not on every
      # review round.
      - name: The deployed version is named
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          before='${{ github.event.before }}'
          if [ -z "$before" ] || ! git cat-file -e "$before^{commit}" 2>/dev/null; then
            echo "No comparable previous commit (new branch or force-push) — skipped."
            exit 0
          fi
          # template files are on-demand content, not a build: a community
          # template PR must not need a version bump
          changed=$(git diff --name-only "$before" '${{ github.sha }}' -- app/js app/css app/index.html app/sw.js)
          if [ -z "$changed" ]; then
            echo "Nothing that ships changed."
            exit 0
          fi
          if echo "$changed" | grep -qx 'app/js/version.js'; then
            echo "Version bumped alongside: $(echo "$changed" | tr '\n' ' ')"
            exit 0
          fi
          echo "::error file=app/js/version.js::shipped files changed without bumping APP_VERSION: $(echo "$changed" | tr '\n' ' ')"
          exit 1

  # A runtime asset missing from the sw.js SHELL list breaks the app OFFLINE
  # only — invisible in every normal test. app/icons/icon.svg is the source the
  # PNGs are generated from, never fetched at runtime, so it stays out.
  # Template FILES stay out too: they are on-demand content the service
  # worker caches on first load — only the manifest is precached, so a
  # community template PR never has to touch sw.js.
  shell-list:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # SHELL entries are relative to app/ — the directory that becomes the
      # site root — so the listed paths are taken from inside it.
      - name: Every runtime asset is in the sw.js SHELL list
        working-directory: app
        run: |
          missing=0
          while IFS= read -r f; do
            if ! grep -qF "'$f'" sw.js; then
              echo "::error file=app/sw.js::$f is not in the SHELL list — it would be missing offline"
              missing=1
            fi
          done < <(git ls-files 'js/*.js' 'css/*.css' 'icons/*.png' 'templates/index.json')
          [ "$missing" -eq 0 ] && echo "SHELL list covers every runtime asset."
          exit "$missing"

  # Lint only (biome.jsonc — the formatter is off, every disabled rule says
  # why). Catches what parsing cannot: unused variables and parameters,
  # shadowed globals, a regex class that matches anything. Same pnpm setup
  # as smoke; nothing it installs is ever deployed.
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # before setup-node, or `cache: pnpm` has no pnpm to find
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome ci

  # What a stub DOM cannot see, on principle: app/js/app.js loading at all, five
  # click handlers in a row across three re-renders, a box's real metrics, a
  # service worker registering. The app that ships stays dependency-free —
  # this job is the only place node_modules exists, and nothing from it
  # reaches the browser.
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # before setup-node, or `cache: pnpm` has no pnpm to find
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Playwright is deliberately off onlyBuiltDependencies, so the browser
      # download is this explicit step — which is what makes it cacheable.
      - name: Cache the browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: failure()
        with:
          name: smoke-report
          path: playwright-report/
          retention-days: 7

  # No-build site: app/ IS the publish dir, uploaded as it is in the repo —
  # tests, docs and tooling around it never reach Pages. Only main deploys;
  # pull_request runs stop after the checks.
  deploy:
    needs: [test, static-checks, shell-list, lint, smoke]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # `path: app` uploads that directory with no exclude list. An install
      # lands in the repo root, outside it — this keeps it that way, made
      # explicit rather than left as a trap for the next person who adds a
      # build step inside app/.
      - name: The publish directory carries no install
        run: |
          if [ -e app/node_modules ] || [ -e app/package.json ]; then
            echo "::error::app/ carries an install or a package manifest — it would be deployed"
            exit 1
          fi
          echo "Publish directory is install-free."
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: app
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
