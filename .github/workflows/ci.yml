name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      # every test/*.test.mjs runs — a new module's tests must not need a
      # workflow edit to be taken seriously
      - run: for f in test/*.test.mjs; do echo "== $f"; node "$f" || exit 1; done

  # No build step means nothing parses the shipped scripts before a browser
  # does: a stray typo in js/app.js or sw.js sails through the logic tests
  # (they import single modules) and only breaks the live page. This parses
  # every one of them.
  # NOT `node --check <file>`: for a plain .js file that parses as CommonJS,
  # node detects the ESM syntax, switches, and then exits 0 without ever
  # reporting the module parse error — verified red-vs-green on node 24.20
  # and 26.7, where a deliberately broken js/app.js passed. Feeding the file
  # in with --input-type=module forces a real module parse, which is also why
  # the file name is echoed by hand: the error then points at "[stdin]".
  static-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
      - name: Every shipped script parses
        run: |
          for f in js/*.js sw.js; do
            echo "== $f"
            node --input-type=module --check < "$f" || exit 1
          done

  # A runtime asset missing from the sw.js SHELL list breaks the app OFFLINE
  # only — invisible in every normal test. icons/icon.svg is the source the
  # PNGs are generated from, never fetched at runtime, so it stays out.
  # Template FILES stay out too: they are on-demand content the service
  # worker caches on first load — only the manifest is precached, so a
  # community template PR never has to touch sw.js.
  shell-list:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Every runtime asset is in the sw.js SHELL list
        run: |
          missing=0
          while IFS= read -r f; do
            if ! grep -qF "'$f'" sw.js; then
              echo "::error file=sw.js::$f is not in the SHELL list — it would be missing offline"
              missing=1
            fi
          done < <(git ls-files 'js/*.js' 'css/*.css' 'icons/*.png' 'templates/index.json')
          [ "$missing" -eq 0 ] && echo "SHELL list covers every runtime asset."
          exit "$missing"

  # Flat no-build site: the repo root IS the publish dir. Only main deploys;
  # pull_request runs stop after the checks.
  deploy:
    needs: [test, static-checks, shell-list]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    concurrency:
      group: pages
      cancel-in-progress: true
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/upload-pages-artifact@v5
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v5
